    # - "./meta/ubc_train_meta.json"
    - "./meta_comp1/fd_1000_fixed_meta.json"
    - "./meta_comp1/fd_2000_meta.json"
    - "./meta_comp1/fd_3000_meta.json"
    - "./meta_comp1/fd_4000_meta.json"
    - "./meta_comp1/fd_5000_meta.json"
    - "./meta_comp1/fd_6000_meta.json"
    - "./meta_comp1/fd_7000_meta.json"
    - "./meta_comp1/fd_8000_fixed_meta.json"
    - "./meta_comp2/fd_1000_fixed_meta.json"
    - "./meta_comp2/fd_2000_meta.json"
    - "./meta_comp2/fd_3000_meta.json"
    - "./meta_comp2/fd_4000_meta.json"
    - "./meta_comp2/fd_5000_meta.json"
    - "./meta_comp2/fd_6000_meta.json"
    - "./meta_comp2/fd_7000_meta.json"
    - "./meta_comp2/fd_8000_fixed_meta.json"
    - "./meta_comp3/fd_1000_fixed_meta.json"
    - "./meta_comp3/fd_2000_meta.json"
    - "./meta_comp3/fd_3000_meta.json"
    - "./meta_comp3/fd_4000_meta.json"
    - "./meta_comp3/fd_5000_meta.json"
    - "./meta_comp3/fd_6000_meta.json"
    - "./meta_comp3/fd_7000_meta.json"
